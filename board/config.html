<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spadework settings</title>
<link rel="stylesheet" href="style.css">
<script src="page.js" defer></script>
<script src="config.js" defer></script>
</head>
<body class="cf-page">
<header id="top" hidden>
  <span class="logo">SPADEWORK</span>
  <span class="count">Settings</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="theme" type="button"></button>
</header>
<div id="message" class="message" hidden></div>
<main class="cf-main" id="main" hidden>
  <div class="cf" id="form"></div>
</main>
<footer class="cf-bar" id="bar" hidden>
  <div class="cf-summary" id="summary" role="alert"></div>
  <span class="spacer"></span>
  <button class="btn primary" id="save" type="button">Save</button>
</footer>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
